# The dsh-arxiv bundle patch.
#
# `dsh plugin --profile <name> add github:jwilson411/dsh-arxiv` installs this
# package into the profile, sees the `dsh.bundle.patch` field in its
# package.json, and appends the package to the profile manifest's ordered
# `dsh.profile.bundles` list. This file is then composed as one layer over the
# bundles below it and under the profile's own cordis.patch.yml.
#
# One insert, one row: the arXiv function plugin. A later layer — the profile's
# cordis.patch.yml or a `--patch` overlay — addresses the row by its `id`. Note
# that an id-targeted patch replaces the row's whole `config` rather than
# merging into it, so an override must restate the fields it keeps.

- insert:
    - id: arxiv
      name: dsh-arxiv
